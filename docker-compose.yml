name: careerstudio-ai

networks:
  careernet:
    driver: bridge

volumes:
  ollama_data:
  ml_models:
  redis_data:
  mongo_data:
  nginx_certs:

services:

  careercamp-gateway:
    build:
      context: .
      dockerfile: Dockerfile

    image: careerstudio/careercamp-gateway:latest
    container_name: careercamp-gateway
    restart: unless-stopped

    ports:
      - "3002:3002"

    environment:
      NODE_ENV: production
      CAREERCAMP_PORT: "3002"
      OLLAMA_URL: "http://ollama:11434"
      ML_SERVER_URL: "http://careercamp-ml:3003"

      ALLOW_EXTERNAL_AI: "${ALLOW_EXTERNAL_AI:-true}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"

      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"

      BRAVE_SEARCH_API_KEY: "${BRAVE_SEARCH_API_KEY:-}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"

      HF_TOKEN: "${HF_TOKEN:-}"
      ELEVENLABS_API_KEY: "${ELEVENLABS_API_KEY:-}"

      CAREERCAMP_API_KEY: "${CAREERCAMP_API_KEY:-}"
      CS_TRANSFORMER_API_KEY: "${CS_TRANSFORMER_API_KEY:-}"

      INTERNAL_SECRET: "${INTERNAL_SECRET:-careercamp-internal-2025}"

    volumes:
      - ml_models:/app/models

    networks:
      - careernet

    depends_on:
      ollama:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  careercamp-ml:
    build:
      context: .
      dockerfile: Dockerfile.py

    image: careerstudio/careercamp-ml:latest
    container_name: careercamp-ml
    restart: unless-stopped

    ports:
      - "3003:3003"

    environment:
      ML_SERVER_PORT: "3003"
      DEVICE: "cpu"
      HF_TOKEN: "${HF_TOKEN:-}"

    volumes:
      - ml_models:/app/models
      - "${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface"

    networks:
      - careernet

    profiles:
      - full
      - ml

    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G


  careercamp-ml-gpu:
    build:
      context: .
      dockerfile: Dockerfile.py

    image: careerstudio/careercamp-ml-gpu:latest
    container_name: careercamp-ml-gpu
    restart: unless-stopped

    ports:
      - "3003:3003"

    environment:
      ML_SERVER_PORT: "3003"
      DEVICE: "cuda"
      HF_TOKEN: "${HF_TOKEN:-}"

    volumes:
      - ml_models:/app/models
      - "${USERPROFILE}/.cache/huggingface:/root/.cache/huggingface"

    networks:
      - careernet

    profiles:
      - gpu

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu


  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      OLLAMA_MAX_LOADED_MODELS: "4"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_FLASH_ATTENTION: "1"

    networks:
      - careernet

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu

    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s


  careerstudio-app:
    build:
      context: ../cs_fixed
      dockerfile: Dockerfile

    image: careerstudio/app:latest
    container_name: careerstudio-app
    restart: unless-stopped

    ports:
      - "3001:3001"

    environment:
      NODE_ENV: production
      PORT: "3001"

      CAMP_API_URL: "http://careercamp-gateway:3002/v1"
      CAREERCAMP_BASE_URL: "http://careercamp-gateway:3002/v1"

      MONGODB_URI: "${MONGODB_URI:-}"
      JWT_SECRET: "${JWT_SECRET:-}"

      ALLOW_EXTERNAL_AI: "${ALLOW_EXTERNAL_AI:-true}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"

      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_MODEL: "${OPENROUTER_MODEL:-}"

    networks:
      - careernet

    depends_on:
      careercamp-gateway:
        condition: service_healthy

    profiles:
      - full
      - app


  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - "./nginx/careerstudio.conf:/etc/nginx/conf.d/careerstudio.conf:ro"
      - nginx_certs:/etc/letsencrypt

    networks:
      - careernet

    depends_on:
      careercamp-gateway:
        condition: service_healthy
      careerstudio-app:
        condition: service_started

    profiles:
      - full
      - prod
