services:
  - type: web
    name: careercamp-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    # Disabled — real deploys are now gated on the main career-studio repo's
    # .github/workflows/ci.yml `deploy` job, which calls Render's Deploy API
    # directly after the Platform Rules 3.1/4.1/5.1 CI gates + smoke tests
    # pass. Set to false here and via a direct API call on the live service
    # (render.yaml Blueprint sync isn't reliably applied to the live
    # service — confirmed on the sibling career-studio service, don't trust
    # editing this file alone to change live behavior).
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CAREERCAMP_PORT
        value: "10000"

      # Set back to "false" per explicit "internal model only, no external
      # model" instruction (2026-08-26). Real consequence, stated plainly:
      # Ollama is NOT available on Render's plain web-service tier, so if
      # this specific service is genuinely the one serving production
      # (rather than the RunPod GPU pod, which does run Ollama), it now has
      # zero working LLM backend at all -- it will honestly degrade to the
      # offline/unavailable response for every request instead of silently
      # using Groq/OpenRouter. That's the correct internal-only behavior,
      # not a bug, but it means this deployment target needs the real
      # RunPod pod (or another genuinely internal host) to ever answer.
      - key: ALLOW_EXTERNAL_AI
        value: "false"

      # Auth key — cs_fixed uses this to authenticate to this gateway
      # Set to same value as CAREERCAMP_API_KEY in your cs_fixed Render service
      - key: CAREERCAMP_API_KEY
        sync: false
      - key: CS_TRANSFORMER_API_KEY
        sync: false
      - key: CAREERCAMP_SECRET_KEY
        sync: false
      - key: INTERNAL_SECRET
        sync: false

      # Ollama — not available on Render; gateway falls through to external AI
      - key: OLLAMA_URL
        value: "http://localhost:11434"
      - key: ML_SERVER_URL
        value: "http://localhost:3003"

      # External AI providers (fallback when Ollama offline)
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free

      # Internet grounding
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

      # Voice / media
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false

      # CORS — set to your cs_fixed Render URL after first deploy
      - key: ALLOWED_ORIGINS
        sync: false
